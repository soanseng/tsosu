<style>
  :root {
    --bg: #faf9f7;
    --surface: #ffffff;
    --text: #1c1b1a;
    --muted: #6b6560;
    --accent: #6d28d9;
    --accent-soft: #ede9fe;
    --border: #e5e1dc;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.75;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 0 24px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Language toggle */
  .lang-switch {
    position: absolute; top: 20px; right: 24px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--accent); font-weight: 700; font-size: 14px;
    padding: 6px 16px; border-radius: 999px; cursor: pointer;
    transition: transform .1s ease;
  }
  .lang-switch:hover { transform: translateY(-1px); }

  /* Hero */
  header { padding: 72px 0 48px; text-align: center; position: relative; }
  .logo {
    font-size: 20px; letter-spacing: 4px; color: var(--accent);
    font-weight: 700; text-transform: uppercase; margin-bottom: 12px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .logo img { width: 40px; height: 40px; border-radius: 10px; }
  h1 { font-size: clamp(32px, 6vw, 52px); line-height: 1.25; font-weight: 800; }
  h1 .sub { display: block; font-size: clamp(18px, 3vw, 24px); font-weight: 600; color: var(--muted); margin-top: 8px; }
  .tagline { font-size: 18px; color: var(--muted); margin: 20px auto 32px; max-width: 620px; }
  .cta-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .btn {
    display: inline-block; padding: 14px 28px; border-radius: 999px;
    font-weight: 700; font-size: 16px; transition: transform .1s ease;
  }
  .btn:hover { transform: translateY(-1px); text-decoration: none; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-secondary { background: var(--accent-soft); color: var(--accent); }
  .badges { margin-top: 20px; font-size: 14px; color: var(--muted); }
  .badges .ver {
    display: inline-block; background: var(--accent-soft); color: var(--accent);
    font-weight: 700; border-radius: 999px; padding: 1px 12px; margin-right: 8px;
  }

  /* Sections */
  section { padding: 48px 0; }
  h2 { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
  .section-sub { color: var(--muted); margin-bottom: 28px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; position: relative;
  }
  .card h3 { font-size: 18px; margin-bottom: 8px; }
  .card p { font-size: 15px; color: var(--muted); }
  .card .icon { font-size: 26px; display: block; margin-bottom: 8px; }
  .card .new {
    position: absolute; top: 14px; right: 14px;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    letter-spacing: .5px; border-radius: 999px; padding: 1px 10px;
  }

  /* Install */
  .install { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; }
  .steps { counter-reset: step; list-style: none; margin: 20px 0; }
  .steps li {
    counter-increment: step; position: relative;
    padding: 14px 16px 14px 58px; margin-bottom: 10px;
    background: var(--bg); border-radius: 10px; font-size: 16px;
  }
  .steps li::before {
    content: counter(step); position: absolute; left: 16px; top: 50%;
    transform: translateY(-50%); width: 28px; height: 28px; line-height: 28px;
    border-radius: 50%; background: var(--accent); color: #fff;
    text-align: center; font-weight: 700; font-size: 14px;
  }
  code, .path {
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
    background: var(--accent-soft); color: var(--accent);
    padding: 2px 8px; border-radius: 6px; font-size: 0.92em;
  }
  .alt { margin-top: 18px; font-size: 14px; color: var(--muted); }

  /* Sync table */
  table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; font-size: 15px; }
  th, td { padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: left; }
  th { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  tr:last-child td { border-bottom: none; }

  /* Privacy strip */
  .privacy {
    background: linear-gradient(135deg, #3730a3, #7c3aed); color: #fff; border-radius: var(--radius);
    padding: 32px; text-align: center;
  }
  .privacy h2 { color: #fff; }
  .privacy p { opacity: .92; max-width: 640px; margin: 8px auto 0; }

  footer { padding: 40px 0 56px; text-align: center; color: var(--muted); font-size: 14px; }
  footer .links { margin-bottom: 10px; }
  footer .links a { margin: 0 10px; }

  /* Screenshots */
  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-top: 8px; }
  .gallery a { display: block; }
  .gallery img {
    width: 100%; border-radius: 12px; border: 1px solid var(--border);
    box-shadow: 0 4px 14px rgba(0,0,0,.06); display: block;
  }
  .gallery figcaption { font-size: 13px; color: var(--muted); text-align: center; margin-top: 6px; }

  /* Obsidian guide */
  .btn-ghost {
    background: transparent; color: var(--accent);
    border: 1.5px solid var(--accent); padding: 12px 22px;
  }
  pre.tasks-q {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; overflow-x: auto; font-size: 13px; line-height: 1.6;
    font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  @media (max-width: 600px) {
    header { padding-top: 48px; }
    .install { padding: 22px; }
    .wrap { padding: 0 16px; }
    section { padding: 36px 0; }
    h2 { font-size: 24px; }
    .grid { grid-template-columns: 1fr; }
    .gallery { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    table { font-size: 14px; }
    th, td { padding: 10px 12px; }
  }
</style>
</head>

  function apply(lang) {
    var dict = I18N[lang] || I18N.zh;
    document.documentElement.lang = lang === "en" ? "en" : "zh-TW";
    document.title = dict.title;
    var els = document.querySelectorAll("[data-i18n]");
    for (var i = 0; i < els.length; i++) {
      var k = els[i].getAttribute("data-i18n");
      if (dict[k] !== undefined) els[i].textContent = dict[k];
    }
    els = document.querySelectorAll("[data-i18n-html]");
    for (var j = 0; j < els.length; j++) {
      var kh = els[j].getAttribute("data-i18n-html");
      if (dict[kh] !== undefined) els[j].innerHTML = dict[kh];
    }
    document.getElementById("langSwitch").textContent = dict.switch_to;
    try { localStorage.setItem("tsosu-lang", lang); } catch (e) {}
  }

  function current() {
    try {
      var saved = localStorage.getItem("tsosu-lang");
      if (saved === "en" || saved === "zh") return saved;
    } catch (e) {}
    var n = (navigator.language || "").toLowerCase();
    return n.indexOf("zh") === 0 ? "zh" : "en";
  }

  function toggle() { apply(current() === "zh" ? "en" : "zh"); }

  document.getElementById("langSwitch").addEventListener("click", toggle);
  document.getElementById("langFooter").addEventListener("click", function (e) { e.preventDefault(); toggle(); });
  apply(current());
})();
